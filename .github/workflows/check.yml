name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      TZ: UTC
      DO_NOT_TRACK: "1"
      CF_SEND_TELEMETRY: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        # Reads the exact pnpm version from packageManager; does not install dependencies.
        with:
          install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run all project checks
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          pnpm run check 2>&1 | tee test-results/check.log
      - name: Preserve test reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
